<!-- Reusable Confirmation Modal -->
<div id="confirmModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
  <div class="modal-box">
    <div class="modal-header" id="confirmModalTitle">
      Confirm Action
    </div>
    <div class="modal-body" id="confirmModalMessage">
      Are you sure you want to perform this action? This operation cannot be undone.
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary btn-sm" id="confirmModalCancel">Cancel</button>
      <button type="button" class="btn btn-danger btn-sm" id="confirmModalSubmit">Confirm</button>
    </div>
  </div>
</div>
