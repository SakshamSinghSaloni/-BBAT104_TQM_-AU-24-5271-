{% extends "base.html" %}

{% block title %}Teacher Login{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card" style="border-top: 4px solid var(--primary); padding: 2rem;">
    <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; text-align: center;">Instructor Login</h1>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.75rem; text-align: center;">
      Access your assessment dashboard and quiz management console.
    </p>

    <form action="/auth/login" method="post">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="teacher@university.edu" required autofocus>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
        Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
      Don't have an instructor account? <a href="/auth/register" style="color: var(--primary); font-weight: 600; text-decoration: none;">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
